<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="light dark" />
<title>Admin — Safkat Turza</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/admin/admin.css" />
</head>
<body>

<!-- ------------------------------------------------------------- sign in -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mark">ST</div>
    <h1>Admin access</h1>
    <p>Sign in to edit your site.</p>
    <label class="f-label" for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" />
    <button class="btn btn-primary" id="loginBtn" type="button">Sign in</button>
    <div class="gate-err" id="gateErr" role="alert"></div>
  </div>
</div>

<!-- ----------------------------------------------------------- the panel -->
<div class="app" id="app" hidden>

  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <span class="sb-mark" aria-hidden="true">ST</span>
      <span class="sb-name">Safkat Turza<small>Site editor</small></span>
    </div>
    <nav class="sb-nav" id="nav" aria-label="Sections"></nav>
    <div class="sb-foot">
      <a class="btn btn-ghost btn-sm" href="/" target="_blank" rel="noopener">View site</a>
      <button class="ibtn" id="themeBtn" type="button" aria-label="Switch theme"></button>
      <button class="ibtn" id="signOut" type="button" aria-label="Sign out" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h5v18h-5"/><path d="M10 8 6 12l4 4M6 12h9"/></svg>
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="ibtn burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="tb-title" id="tbTitle">Overview</span>
      <span class="tb-spacer"></span>
      <span class="savestate" id="saveState" data-s="clean" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span class="lbl" id="saveLabel">All changes saved</span>
      </span>
      <button class="btn btn-ghost btn-sm" id="revertBtn" type="button">Revert</button>
      <button class="btn btn-primary btn-sm" id="saveBtn" type="button" disabled>Save</button>
    </header>

    <div class="panel-scroll" id="panelScroll">
      <div id="panelHost"></div>
    </div>
  </div>
</div>

<script type="module" src="/assets/admin/app.js"></script>
</body>
</html>
